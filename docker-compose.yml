# ===================================================================
# TrackFlow Docker Compose Configuration
# ===================================================================
# Run: docker-compose up -d

version: '3.8'

services:
  # -----------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: trackflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackflow_db
      POSTGRES_USER: trackflow
      POSTGRES_PASSWORD: trackflow_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackflow -d trackflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
