version: '3.8'

services:
  # -----------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -----------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: trackflow-postgres
    restart: always
    environment:
      POSTGRES_DB: trackflow_db
      POSTGRES_USER: trackflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trackflow_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trackflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackflow -d trackflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 2. Spring Boot Web Application Service
  # -----------------------------------------------------------------
  trackflow-app:
    build: .
    container_name: trackflow-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Inject DB credentials pointing to internal docker network name
      DB_URL: jdbc:postgresql://postgres-db:5432/trackflow_db
      DB_USERNAME: trackflow
      DB_PASSWORD: ${DB_PASSWORD:-trackflow_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - trackflow-net
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

volumes:
  pgdata:
    driver: local

networks:
  trackflow-net:
    driver: bridge
