# ===================================================================
# TrackFlow Application Configuration
# ===================================================================

spring:
  application:
    name: TrackFlow

  # ---------------------------------------------------------------
  # Database Configuration
  # ---------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/trackflow_db
    username: trackflow
    password: trackflow_secret
    driver-class-name: org.postgresql.Driver

    # HikariCP Connection Pool Settings
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000       # 5 minutes
      connection-timeout: 20000  # 20 seconds
      max-lifetime: 1200000      # 20 minutes

  # ---------------------------------------------------------------
  # JPA / Hibernate Configuration
  # ---------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update   # Use 'validate' in production with Flyway/Liquibase
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

    open-in-view: false  # Best practice: disable OSIV to avoid lazy loading issues

  # ---------------------------------------------------------------
  # Servlet Configuration
  # ---------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 25MB

# ===================================================================
# Server Configuration
# ===================================================================
server:
  port: 8080
  servlet:
    context-path: /api

# ===================================================================
# JWT Configuration
# ===================================================================
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970   # Change in production!
    access-token-expiration: 900000      # 15 minutes in milliseconds
    refresh-token-expiration: 604800000  # 7 days in milliseconds
    issuer: TrackFlow

  # -----------------------------------------------------------------
  # File Storage Configuration
  # -----------------------------------------------------------------
  storage:
    type: local                                     # Options: local, minio, s3
    local:
      upload-dir: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,pdf,zip,log,txt
    max-file-size: 10485760  # 10MB in bytes

# ===================================================================
# Swagger / OpenAPI Configuration
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ===================================================================
# Logging Configuration
# ===================================================================
logging:
  level:
    root: INFO
    com.trackflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trackflow.log
